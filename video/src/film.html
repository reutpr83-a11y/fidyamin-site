/* ============ ENGINE ============ */
let t0=0; const scenesEl=document.getElementById('scenes');
S.forEach((s,i)=>{ s.start=t0; t0+=s.dur; s.end=t0;
  const d=document.createElement('div'); d.className='scene'; d.innerHTML=s.html; scenesEl.appendChild(d); s.el=d;
  s.anims=[...d.querySelectorAll('.anim')];
});
const TOTAL = t0;
window.TOTAL = TOTAL;

function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function easeOut(p){return 1-Math.pow(1-p,3)}
function easeInOut(p){return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2}
function fmt(n){return n.toLocaleString('en-US')}

function seek(t){
  t = clamp(t,0,TOTAL-0.001);
  document.getElementById('progIn').style.width = (100*t/TOTAL)+'%';
  let cur=null;
  for(const s of S){ const on = (t>=s.start && t<s.end); s.el.classList.toggle('on',on); if(on) cur=s; }
  if(!cur) return;
  const lt = t - cur.start;
  const OUT = 0.42;                            // exit cross-dim
  const rem = cur.dur - lt;
  const sceneOut = rem<OUT ? easeInOut(clamp(rem/OUT,0,1)) : 1;
  cur.el.style.opacity = sceneOut;
  cur.el.style.transform = 'translateY('+((1-sceneOut)*-26).toFixed(2)+'px)';

  for(const a of cur.anims){
    const inT=parseFloat(a.dataset.in||0), dur=parseFloat(a.dataset.dur||0.85), type=a.dataset.t||'up';
    const p = easeOut(clamp((lt-inT)/dur,0,1));
    a.style.opacity = p;
    if(type==='up')      a.style.transform='translateY('+((1-p)*38).toFixed(2)+'px)';
    else if(type==='scale') a.style.transform='scale('+(0.90+0.10*p).toFixed(4)+')';
    else if(type==='wipe'){ a.style.transform='none'; a.style.width=(p*100)+'%'; a.style.opacity=1*(p>0?1:0); }
    else if(type==='fade') a.style.transform='none';
    else if(type==='num'){
      a.style.transform='none';
      const from=parseFloat(a.dataset.from||0), to=parseFloat(a.dataset.to||0);
      const np=easeOut(clamp((lt-inT)/1.25,0,1));
      a.textContent=(a.dataset.pre||'')+fmt(Math.round(from+(to-from)*np));
      a.style.opacity = clamp((lt-inT)/0.35,0,1);
    }
  }
  // HUD countdown
  const hc=document.getElementById('hudCount');
  hc.textContent = cur.count||'';
  hc.style.opacity = cur.count?1:0;

  const g=document.getElementById('grid');
  g.style.transform='translate('+(-t*4.2).toFixed(1)+'px,'+(-t*2.1).toFixed(1)+'px)';

  let ctext='',cop=0;
  for(const c of CUES){ if(t>=c[0]&&t<c[1]){ ctext=c[2];

  if(ci.dataset.cur!==ctext){ ci.innerHTML=ctext; ci.dataset.cur=ctext; }
  ci.style.opacity=cop;
