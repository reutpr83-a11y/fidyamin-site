<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>עדכון התקציב חריש</title>
<style>
/* Ploni is not available in this environment, so Heebo is the single
   family used throughout. No second family is mixed in. */
@font-face{
  font-family:'HeeboV';
  src:url('fonts/Heebo.ttf') format('truetype');
  font-weight:100 900;
  font-display:block;
}

:root{
  --navy-deep:#0b2b44;
  --navy-mid:#123d60;
  --blue:#1a6ba4;
  --cream:#fbfaf6;
  --gold:#f5b04a;
  --blue-deep:#12456e;
}

*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:1080px;height:1920px;overflow:hidden;background:#000;
  font-family:'HeeboV',sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
}

#stage{position:relative;width:1080px;height:1920px;overflow:hidden;isolation:isolate}

/* ---------- background ---------- */
#bg{
  position:absolute;inset:-6%;
  background:linear-gradient(207deg,var(--navy-deep) 0%,#0e3452 32%,var(--navy-mid) 58%,var(--blue) 100%);
  will-change:transform;
}
#glow{
  position:absolute;inset:0;
  background:radial-gradient(46% 34% at 18% 74%,rgba(56,142,204,.32) 0%,rgba(56,142,204,0) 70%);
  will-change:transform;
}
#vignette{
  position:absolute;inset:0;
  background:radial-gradient(120% 78% at 62% 34%,rgba(0,0,0,0) 42%,rgba(4,17,29,.32) 100%);
}
#cream{
  position:absolute;left:0;right:0;top:1740px;height:0;
  background:var(--cream);
}
#wedge{
  position:absolute;left:0;top:1628px;width:100%;height:112px;
  background:linear-gradient(90deg,#19669d 0%,#165482 54%,#123e62 100%);
  clip-path:polygon(0% 100%,0% 6%,93% 100%);
  opacity:0;
}

/* ---------- scenes ---------- */
.scene{position:absolute;inset:0;visibility:hidden}
.scene.on{visibility:visible}

/* a group is the unit of animation. lines inside a group move together,
   which is what keeps this from reading like a slide deck. */
.grp{position:absolute;opacity:0;will-change:opacity,transform}
.grp.r{text-align:right;direction:rtl}
.grp.c{text-align:center;direction:rtl}

.line{display:block;white-space:nowrap}
.line.sp{height:.46em}

/* ---- the whole type scale, three sizes and two weights per frame ----
   hero 128 / 700   the single central figure
   fig  110 / 700   section figures
   head  84 / 700   every message and headline
   exp   54 / 500   explanation under a figure, cream paragraphs
   label 42 / 700   gold section label
   name  32 / 500   council member names                              */
.head{color:#fff;font-weight:700;line-height:1.08;letter-spacing:-.01em}
.fig {color:#fff;font-weight:700;line-height:1.02;letter-spacing:-.022em}
.exp {color:rgba(255,255,255,.76);font-weight:500;line-height:1.22}
.label{color:var(--gold);font-weight:700;line-height:1.2;letter-spacing:.07em}
.tail{color:var(--gold);font-weight:700;line-height:1.08;letter-spacing:-.01em}

.dkfig{color:var(--navy-deep);font-weight:700;line-height:1.02;letter-spacing:-.022em}
.dkexp{color:var(--blue-deep);font-weight:500;line-height:1.22}

.rule{
  position:absolute;width:6px;background:var(--gold);border-radius:3px;
  transform-origin:top center;transform:scaleY(0);will-change:transform,opacity;
}

/* portraits: one crop, one eye line, one spacing */
.faces{display:flex;justify-content:center;gap:42px;direction:ltr}
.face{width:192px;text-align:center}
.face img{
  width:192px;height:192px;border-radius:50%;display:block;
  box-shadow:0 0 0 2px rgba(11,43,68,.12),0 12px 30px rgba(11,43,68,.16);
}
.face span{
  display:block;margin-top:22px;font-size:32px;font-weight:500;
  color:var(--navy-deep);direction:rtl;white-space:nowrap;
}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="glow"></div>
  <div id="vignette"></div>
  <div id="cream"></div>
  <div id="wedge"></div>
  <div id="scenes"></div>
</div>

<script src="script.js"></script>
<script>
(function(){
'use strict';

const L = window.LAYOUT;
const S = window.SCENES;
const BOX_W = L.padRight - L.padLeft;      // 790px column, inside the 760 to 850 band

const TYPE = window.TYPE = {
  hero: 128, fig: 110, head: 84, exp: 54, label: 42, name: 32
};
const GAP = { label: 44, caption: 16, tail: 56 };

/* motion. everything short, nothing springy. */
const RISE      = 18;      // px a group travels on entry
const RISE_FIG  = 12;      // figures move less and land sooner
const PAIR      = 150;     // ms between the two halves of a comparison
const EXIT      = 260;     // ms

const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeIO  = x => x < .5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;

const host = document.getElementById('scenes');
const built = [];
const FITWARN = window.FITWARN = [];
let clock = 0;

function mkLine(parent, txt, cls, size){
  const el = document.createElement('span');
  if(txt === ''){ el.className = 'line sp'; el.style.fontSize = size+'px'; parent.appendChild(el); return null; }
  el.className = 'line ' + cls;
  el.style.fontSize = size+'px';
  el.textContent = txt;
  parent.appendChild(el);
  return el;
}
function mkGroup(sec, align, delay, rise){
  const g = document.createElement('div');
  g.className = 'grp ' + align;
  sec.appendChild(g);
  return { el: g, delay: delay || 0, rise: rise === undefined ? RISE : rise };
}

S.forEach(sc => {
  const sec = document.createElement('div');
  sec.className = 'scene';
  sec.dataset.id = sc.id;
  host.appendChild(sec);

  const groups = [];

  /* ---------- navy ---------- */
  const navG = mkGroup(sec, 'r', 0, sc.type === 'data' ? RISE_FIG : RISE);
  navG.el.style.right = (L.W - L.padRight) + 'px';
  navG.el.style.width = BOX_W + 'px';
  groups.push(navG);

  if(sc.type === 'data'){
    const lab = mkLine(navG.el, sc.label, 'label', TYPE.label);
    lab.style.marginBottom = GAP.label + 'px';
    mkLine(navG.el, sc.top.figure, 'fig', sc.top.hero ? TYPE.hero : TYPE.fig);
    const cap = mkLine(navG.el, sc.top.caption, 'exp', TYPE.exp);
    cap.style.marginTop = GAP.caption + 'px';
  } else {
    (sc.lines || []).forEach(t => mkLine(navG.el, t, 'head', TYPE.head));
  }

  /* the tail is its own beat, a moment after the message lands */
  let tailG = null;
  if(sc.tail){
    tailG = mkGroup(sec, 'r', (sc.enter || 300) + 260);
    tailG.el.style.right = (L.W - L.padRight) + 'px';
    tailG.el.style.width = BOX_W + 'px';
    mkLine(tailG.el, sc.tail, 'tail', TYPE.head);
    tailG.isTail = true;
    groups.push(tailG);
  }

  /* ---------- cream ---------- */
  const hasCream = !!(sc.bottom || sc.creamLines || sc.people);
  let creG = null;
  if(hasCream){
    creG = mkGroup(sec, sc.bottom ? 'r' : 'c', PAIR, sc.bottom ? RISE_FIG : RISE);
    if(sc.bottom){
      creG.el.style.right = (L.W - L.padRight) + 'px';
      creG.el.style.width = BOX_W + 'px';
      mkLine(creG.el, sc.bottom.figure, 'dkfig', TYPE.fig);
      const c = mkLine(creG.el, sc.bottom.caption, 'dkexp', TYPE.exp);
      c.style.marginTop = GAP.caption + 'px';
    } else {
      creG.el.style.left = '0px';
      creG.el.style.width = L.W + 'px';
      if(sc.creamLines) sc.creamLines.forEach(t => mkLine(creG.el, t, 'dkexp', TYPE.exp));
      if(sc.people){
        const row = document.createElement('div');
        row.className = 'faces';
        creG.el.appendChild(row);
        sc.people.forEach(p => {
          const f = document.createElement('div'); f.className = 'face';
          const im = document.createElement('img'); im.src = p.img;
          const sp = document.createElement('span'); sp.textContent = p.name;
          f.appendChild(im); f.appendChild(sp); row.appendChild(f);
        });
      }
    }
    groups.push(creG);
  }

  const rule = document.createElement('div');
  rule.className = 'rule';
  rule.style.left = L.ruleX + 'px';
  sec.appendChild(rule);

  let rule2 = null;
  if(sc.bottom){
    rule2 = document.createElement('div');
    rule2.className = 'rule';
    rule2.style.left = L.ruleX + 'px';
    sec.appendChild(rule2);
  }

  built.push({ sc, sec, navG, creG, tailG, groups, rule, rule2, hasCream,
               enter: sc.enter || 300, lead: sc.lead || 0,
               start: clock, end: clock + sc.dur });
  clock += sc.dur;
});

const TOTAL = window.TOTAL = clock;

/* ---------- measure and place ---------- */
function layout(){
  const rng = document.createRange();
  const textW = e => { rng.selectNodeContents(e); return rng.getBoundingClientRect().width; };

  built.forEach(b => {
    b.sec.classList.add('on');
    b.groups.forEach(g => { g.el.style.opacity = 1; g.el.style.transform = 'none'; });

    /* width guard. copy is hand broken so this must never fire. */
    b.groups.forEach(g => {
      const box = g.el.classList.contains('c') ? 860 : BOX_W;
      Array.from(g.el.querySelectorAll('.line')).forEach(e => {
        const w = textW(e);
        if(w > box + 0.5) FITWARN.push(b.sc.id + ' overflow ' + Math.round(w) + '/' + box + ': ' + e.textContent);
      });
    });

    /* the cream panel is only as tall as what it holds, plus one padding
       above and the untouchable 240px of platform interface below. */
    let ch = 0, creH = 0, panelTop = L.creamBandBottom;
    if(b.hasCream){
      creH = b.creG.el.offsetHeight;
      panelTop = L.creamTextBottom - creH - L.creamPadTop;
      ch = L.creamBandBottom - panelTop;
    }
    b.ch = ch;

    const navBandBottom = ch ? panelTop - 80 : L.safeBottom;

    const navH = b.navG.el.offsetHeight +
                 (b.tailG ? GAP.tail + b.tailG.el.offsetHeight : 0);
    /* with a cream band present the message sits lower, so the two halves
       of a comparison stay close enough to read as one thought */
    const bias = ch ? 0.68 : 0.5;
    let top = L.safeTop + (navBandBottom - L.safeTop - navH) * bias;
    top = Math.max(L.safeTop, Math.round(top));
    b.navG.el.style.top = top + 'px';
    if(b.tailG) b.tailG.el.style.top = (top + b.navG.el.offsetHeight + GAP.tail) + 'px';

    b.rule.style.top = (top - 8) + 'px';
    b.rule.style.height = (navH + 16) + 'px';

    if(b.hasCream){
      const ctop = panelTop + L.creamPadTop;
      b.creG.el.style.top = Math.round(ctop) + 'px';
      if(b.rule2){
        b.rule2.style.top = Math.round(ctop - 8) + 'px';
        b.rule2.style.height = Math.round(creH + 16) + 'px';
      }
    }

    b.navTop = top; b.navBot = top + navH;
    b.creTop = b.hasCream ? panelTop + L.creamPadTop : null;
    b.creBot = b.hasCream ? panelTop + L.creamPadTop + creH : null;

    b.groups.forEach(g => { g.el.style.opacity = 0; });
    b.sec.classList.remove('on');
  });
  window.BOUNDS = built.map(b => ({ id: b.sc.id, nav:[b.navTop,b.navBot],
                                    cream: b.creTop === null ? null : [b.creTop,b.creBot], ch: b.ch }));
}

/* ---------- timeline ---------- */
const bg = document.getElementById('bg');
const glow = document.getElementById('glow');
const creamEl = document.getElementById('cream');
const wedgeEl = document.getElementById('wedge');

function setTime(t){
  t = Math.max(0, Math.min(TOTAL - 0.001, t));

  const p = t / TOTAL;
  bg.style.transform = 'scale(' + (1 + p * 0.04).toFixed(5) + ') translate3d(' +
      (-p * 14).toFixed(2) + 'px,' + (-p * 9).toFixed(2) + 'px,0)';
  glow.style.transform = 'translate3d(' +
      (Math.sin(t * 0.21) * 42).toFixed(2) + 'px,' +
      (Math.cos(t * 0.16) * 30).toFixed(2) + 'px,0)';

  let idx = 0;
  for(let i = 0; i < built.length; i++){ if(t >= built[i].start) idx = i; }
  const cur = built[idx];
  const prev = idx > 0 ? built[idx - 1] : null;
  const local = t - cur.start;

  const MORPH = 0.34;
  let h = cur.ch;
  if(prev && local < MORPH) h = prev.ch + (cur.ch - prev.ch) * easeIO(local / MORPH);
  creamEl.style.top = (L.creamBandBottom - h).toFixed(1) + 'px';
  creamEl.style.height = h.toFixed(1) + 'px';
  wedgeEl.style.opacity = clamp01((h - 120) / 200).toFixed(3);

  built.forEach(b => {
    const active = (t >= b.start - 0.4) && (t < b.end + 0.02);
    if(!active){ if(b.sec.classList.contains('on')) b.sec.classList.remove('on'); return; }
    b.sec.classList.add('on');

    const lt = (t - b.start) * 1000;              // ms into the scene
    const outAt = b.sc.dur * 1000 - EXIT;

    let gOut = 1, gShift = 0;
    if(lt > outAt){
      const k = easeIO(clamp01((lt - outAt) / EXIT));
      gOut = 1 - k;
      gShift = -k * 8;
    }

    b.groups.forEach(g => {
      const k = easeOut(clamp01((lt - b.lead - g.delay) / b.enter));
      g.el.style.opacity = (k * gOut).toFixed(4);
      g.el.style.transform = 'translate3d(0,' + ((1 - k) * g.rise + gShift).toFixed(2) + 'px,0)';
    });

    [b.rule, b.rule2].forEach((r, i) => {
      if(!r) return;
      const k = easeOut(clamp01((lt - b.lead - (i ? PAIR : 0)) / (b.enter + 220)));
      r.style.transform = 'scaleY(' + k.toFixed(4) + ')';
      r.style.opacity = gOut.toFixed(4);
    });
  });
}
window.setTime = setTime;
window.ready = false;

document.fonts.ready.then(async () => {
  await Promise.all(Array.from(document.images).map(im =>
    im.complete ? Promise.resolve() : new Promise(r => { im.onload = im.onerror = r; })));
  layout();
  setTime(0);
  window.ready = true;
});
})();
</script>
</body>
</html>
